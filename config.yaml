# 검색·답변 품질에 영향을 주는 값은 코드가 아니라 여기서 바꾼다. (2.5 검색 설정 설계)

gms_base_url: https://gms.ssafy.io/gmsapi/api.openai.com/v1/

# MODEL_PROFILE 환경변수로 고른다. 개발 중에는 dev로 크레딧을 아낀다.
models:
  dev:
    query: gpt-5.4-nano      # P1 검색어 추출
    select: gpt-5.4-nano     # P2 후보 선별
    answer: gpt-5.4-nano     # P3 답변 생성
  final:
    query: gpt-5.4-nano
    select: gpt-5.4-nano
    answer: gpt-4.1          # 최종 검증 때만
embedding_model: text-embedding-3-small

# 개발 중 같은 프롬프트는 LLM을 다시 부르지 않는다 (SQLite 캐시)
llm_cache: true

paths:
  chroma_dir: chroma
  items: data/items.json
  collect_cache: data/cache/collected.json

collections:
  meta: company_meta
  docs: company_docs
  glossary: glossary

chunk:
  wiki: {size: 1000, overlap: 200}
  dart: {size: 1500, overlap: 200}   # 공시는 표 행이 길고 문맥 단위가 커서 더 크게
  glossary: {size: 2000, overlap: 0} # 용어 1개 = 청크 1개가 원칙 (가장 긴 해설이 약 2,000자)

retrieval:
  top_k: 6                  # 외부 문서 청크 수 (+ 선택 기업 메타 1청크는 항상)
  own_doc_k: 2              # 기업 본문서(위키)에서 먼저 확보할 청크 수
  search_type: similarity   # similarity | mmr
  fetch_k: 30               # MMR 후보 수
  mmr_lambda: 0.5
  explore_k: 30             # 조건 탐색 후보 수
  glossary_k: 2             # 일반 질문에 붙일 용어집 근거 수 (관련도 기준을 넘는 것만)
  glossary_min_score: 0.45  # 임베딩만으로 붙일 때의 최소 관련도 (1 - 코사인 거리). 키워드 일치는 기준 없이 포함
  decompose: true           # 고도화: 두 가지 이상 묻는 질문을 나눠 검색 (골든셋 두 가지 질문 정답률 0.60 → 0.80)
  hybrid: true              # 고도화: 벡터 + 키워드(BM25) 검색 결합 (골든셋 정답률 0.833 → 0.938, chunk_recall 0.875 → 0.969)
  rrf_k: 60
  hybrid_pool_factor: 2     # 벡터·키워드 후보를 top_k의 몇 배씩 가져와 합칠지
  keyword_keep: 2           # 키워드 검색 상위 몇 개는 순위 합산과 상관없이 먼저 넣을지

collect:
  max_queries: 4
  max_candidates_per_query: 5
  max_chunks_per_doc: 30    # 긴 문서(예: '반도체' 204청크)는 앞부분만 색인 — 임베딩 비용과 노이즈 제한
  dart: true                # 기업별 최근 정기보고서(회사의 개요·사업의 내용)를 첫 질문 때 한 번 색인
  max_chunks_per_report: 60
  request_interval_sec: 0.5
  max_retries: 4
